<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Mods Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      background: #111827;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #22c55e;
    }

    header h1 {
      margin: 0;
      color: #22c55e;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .mod {
      background: #111827;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #1f2937;
    }

    .mod h2 {
      margin: 0;
      color: #facc15;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #22c55e;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🔥 Minecraft Mods Hub</h1>
</header>

<div class="container">

  <div class="mod">
    <h2>Super Tools Mod</h2>
    <p>Lepsze narzędzia i szybsze kopanie.</p>
    <a class="btn" href="#">Pobierz</a>
  </div>

  <div class="mod">
    <h2>Better Animals Mod</h2>
    <p>Nowe zwierzęta i ulepszone AI mobów.</p>
    <a class="btn" href="#">Pobierz</a>
  </div>

  <div class="mod">
    <h2>Lucky Blocks Mod</h2>
    <p>Losowe nagrody i pułapki.</p>
    <a class="btn" href="#">Pobierz</a>
  </div>

</div>

</body>
</html>
