<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ModHub</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f0f14;
        color: #fff;
    }

    header {
        background: #1a1a22;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 20px;
        font-weight: bold;
        color: #7c5cff;
    }

    .search input {
        padding: 8px;
        width: 300px;
        border-radius: 6px;
        border: none;
        outline: none;
    }

    .container {
        display: flex;
    }

    aside {
        width: 220px;
        background: #161621;
        padding: 20px;
        min-height: 100vh;
    }

    aside h3 {
        margin-top: 0;
        color: #aaa;
    }

    aside ul {
        list-style: none;
        padding: 0;
    }

    aside li {
        padding: 8px 0;
        color: #ddd;
        cursor: pointer;
    }

    main {
        flex: 1;
        padding: 20px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 15px;
    }

    .card {
        background: #1c1c28;
        padding: 15px;
        border-radius: 10px;
        transition: 0.2s;
    }

    .card:hover {
        transform: scale(1.03);
        background: #242437;
    }

    .card h4 {
        margin: 0 0 10px 0;
    }

    .tag {
        font-size: 12px;
        color: #aaa;
    }

    button {
        margin-top: 10px;
        padding: 8px;
        width: 100%;
        border: none;
        border-radius: 6px;
        background: #7c5cff;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #6848ff;
    }
</style>
</head>
<body>

<header>
    <div class="logo">ModHub</div>
    <div class="search">
        <input type="text" placeholder="Szukaj modów...">
    </div>
</header>

<div class="container">

<aside>
    <h3>Kategorie</h3>
    <ul>
        <li>Popularne</li>
        <li>Nowe</li>
        <li>Fabric</li>
        <li>Forge</li>
        <li>Pakiety modów</li>
    </ul>
</aside>

<main>
    <h2>Popularne mody</h2>

    <div class="grid">

        <div class="card">
            <h4>Better Tools</h4>
            <div class="tag">Forge • 1.20+</div>
            <button>Pobierz</button>
        </div>

        <div class="card">
            <h4>Magic Expansion</h4>
            <div class="tag">Fabric • 1.19+</div>
            <button>Pobierz</button>
        </div>

        <div class="card">
            <h4>FPS Booster</h4>
            <div class="tag">All versions</div>
            <button>Pobierz</button>
        </div>

        <div class="card">
            <h4>Biomes Plus</h4>
            <div class="tag">Forge • 1.18+</div>
            <button>Pobierz</button>
        </div>

    </div>
</main>

</div>

</body>
</html>
