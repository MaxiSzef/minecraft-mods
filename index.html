<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Mods Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .topbar {
      background: #0b1220;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
    }

    .logo {
      color: #22c55e;
      font-weight: bold;
      font-size: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: #111827;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #1f2937;
    }

    .card h3 {
      color: #facc15;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #22c55e;
      color: black;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="topbar">
  <div class="logo">⛏ Minecraft Mods Hub</div>
</div>

<div class="container">

  <h1>Twoje mody</h1>
  <p>Strona działa lokalnie 👍</p>

  <div class="grid">

    <div class="card">
      <h3>Super Tools Mod</h3>
      <p>Szybsze kopanie i lepsze narzędzia.</p>
      <a class="btn" href="#">Pobierz</a>
    </div>

    <div class="card">
      <h3>Better Animals</h3>
      <p>Nowe zwierzęta i AI mobów.</p>
      <a class="btn" href="#">Pobierz</a>
    </div>

  </div>

</div>

</body>
</html>
